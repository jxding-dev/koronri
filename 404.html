<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314110e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e11d29'/%3E%3C/svg%3E" />
    <title>페이지를 찾을 수 없습니다 — ころんり</title>
    <style>
      :root {
        --ink: #14110e;
        --muted: #6b6b6b;
        --accent: #e11d29;
        --line: rgba(20, 17, 14, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background: #fff;
        color: var(--ink);
        font-family: "Pretendard Variable", "Pretendard", "Noto Sans KR",
          system-ui, -apple-system, "Segoe UI", sans-serif;
        font-weight: 300;
        letter-spacing: 0.01em;
        line-height: 1.7;
      }
      .box {
        max-width: 30rem;
        width: 100%;
        text-align: center;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        font-size: 1.05rem;
        letter-spacing: 0.06em;
        color: var(--ink);
        margin-bottom: 2.4rem;
      }
      .mark b {
        font-weight: 500;
      }
      .mark .tag {
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
        display: inline-block;
      }
      .code {
        font-size: 3.4rem;
        font-weight: 300;
        letter-spacing: 0.08em;
        margin: 0 0 0.4rem;
      }
      h1 {
        font-size: 1.15rem;
        font-weight: 400;
        margin: 0 0 0.6rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 2rem;
        font-size: 0.95rem;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        justify-content: center;
      }
      a.btn {
        display: inline-block;
        padding: 0.7rem 1.35rem;
        border-radius: 999px;
        text-decoration: none;
        font-size: 0.9rem;
        letter-spacing: 0.02em;
        border: 1px solid var(--line);
        color: var(--ink);
        transition: background 0.18s ease, color 0.18s ease;
      }
      a.btn--primary {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      a.btn:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <span class="mark"><span class="dot"></span><b>ころんり</b><span class="tag">Studio</span></span>
      <p class="code">404</p>
      <h1>페이지를 찾을 수 없습니다</h1>
      <p>주소가 바뀌었거나 삭제된 페이지일 수 있어요.</p>
      <div class="links">
        <a class="btn btn--primary" href="/commission/index.html">커미션 안내</a>
        <a class="btn" href="/commission/adoption.html">분양 안내</a>
        <a class="btn" href="/commission/pricing.html">가격 안내</a>
      </div>
    </main>
  </body>
</html>
